name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Windows integration smoke
        if: runner.os == 'Windows'
        run: node scripts/windows-integration.mjs

      - run: npm run typecheck
      - run: npx playwright install chromium
      - run: npx playwright test
